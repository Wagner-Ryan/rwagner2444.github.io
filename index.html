<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WEGREEN FINANCE</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1b4332;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
        env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    header {
      flex-shrink: 0;
      padding: 1rem 1rem 0.5rem;
      text-align: center;
    }

    h1 {
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(1.25rem, 5vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 0.5rem 1rem 1rem;
    }

    img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <header>
    <h1>WEGREEN FINANCE</h1>
  </header>
  <main>
    <img src="image.jpg" alt="" width="768" height="1024" />
  </main>
</body>
</html>
